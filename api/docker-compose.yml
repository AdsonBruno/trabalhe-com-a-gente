services:
  api:
    container_name: git-api-app
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - redis-cache

  redis-cache:
    image: redis:7-alpine
    container_name: git-api-cache
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning
